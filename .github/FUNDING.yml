# Funding / Sponsors

This project is a free-time side project. No sponsorship, donation links or commercial offering are associated with it.

If you find it useful and want to support future maintenance, the **best contribution** is:

1. ⭐ Starring the repository,
2. 🐛 Filing clear bug reports and PRs,
3. 📣 Telling other developers about it.

Commercial support, feature sponsorship or paid customisations can be arranged on a case-by-case basis — open an issue with the `[config]` label as a starting point and we can take it from there.