<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Errore Invio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/error.css">
</head>
<body class="bg-mesh min-h-screen flex items-center justify-center p-4">
<div class="absolute top-20 left-20 w-72 h-72 bg-red-500/20 rounded-full blur-3xl animate-float"></div>
<div class="absolute bottom-20 right-20 w-96 h-96 bg-orange-500/20 rounded-full blur-3xl animate-float" style="animation-delay: -3s;"></div>

<div class="glass rounded-3xl p-10 w-full max-w-md text-center relative z-10 shadow-2xl">
  <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-red-400 to-rose-600 mb-6 shadow-lg shadow-red-500/30 animate-shake">
    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path>
    </svg>
  </div>
  <h1 class="text-2xl font-bold text-white mb-3">Errore nell'invio</h1>
  <p class="text-slate-400 mb-4">Si è verificato un problema durante l'invio dell'email.</p>
  <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 mb-6">
    <p class="text-red-300 text-sm font-mono">{{.Error}}</p>
  </div>
  <a href="/" class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium rounded-xl hover:shadow-lg hover:shadow-indigo-500/30 transition-all duration-300 hover:-translate-y-0.5">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
    </svg>
    Torna al form
  </a>
</div>
</body>
</html>
