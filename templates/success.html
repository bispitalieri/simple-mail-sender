<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{T "success_title"}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/success.css">
</head>
<body class="bg-mesh min-h-screen flex items-center justify-center p-4">
<div class="absolute top-20 left-20 w-72 h-72 bg-green-500/20 rounded-full blur-3xl animate-float"></div>
<div class="absolute bottom-20 right-20 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl animate-float" style="animation-delay: -3s;"></div>

<div class="glass rounded-3xl p-10 w-full max-w-md text-center relative z-10 shadow-2xl">
  <div class="flex justify-center mb-6">
    <div class="flex gap-2">
      {{range .AvailableLangs}}
        {{if eq . $.Lang}}
          <span class="px-3 py-1.5 text-xs font-medium text-white bg-gradient-to-r from-indigo-500 to-purple-600 rounded-lg">{{langName .}}</span>
        {{else}}
          <a href="/?lang={{.}}" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/30 rounded-lg transition-all duration-300">{{langName .}}</a>
        {{end}}
      {{end}}
    </div>
  </div>

  <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-green-400 to-emerald-600 mb-6 shadow-lg shadow-green-500/30 animate-bounce-slow">
    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
    </svg>
  </div>
  <h1 class="text-2xl font-bold text-white mb-3">{{T "success_heading"}}</h1>
  <p class="text-slate-400 mb-8">{{T "success_message"}}</p>
  <a href="/" class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium rounded-xl hover:shadow-lg hover:shadow-indigo-500/30 transition-all duration-300 hover:-translate-y-0.5">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
    </svg>
    {{T "send_another"}}
  </a>
</div>
</body>
</html>
